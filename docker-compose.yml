services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storage-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    container_name: storage-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "server=sqlserver;port=1433;user id=sa;password=YourStrong@Passw0rd!;database=storage;encrypt=disable;trustservercertificate=true"
    depends_on:
      sqlserver:
        condition: service_healthy
